name: clipforge

x-api-env: &api-env
  env_file: .env
  environment:
    # Inside the compose network the services are reachable by name.
    DATABASE_URL: postgresql+asyncpg://clipforge:clipforge@postgres:5432/clipforge
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
      POSTGRES_DB: clipforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge -d clipforge"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Community build of MinIO server; upstream stopped publishing images to Docker Hub.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  storage-init:
    # Creates the bucket idempotently using the app's own S3 client, so it works with any backend.
    image: clipforge-api
    <<: *api-env
    command: ["python", "-m", "scripts.ensure_bucket"]
    depends_on:
      migrate:
        condition: service_started
      minio:
        condition: service_healthy

  migrate:
    build: ./apps/api
    image: clipforge-api
    <<: *api-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: clipforge-api
    <<: *api-env
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  worker:
    image: clipforge-api
    <<: *api-env
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=ingest,analyze,render
      - --concurrency=2
      - --hostname=worker@%h
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d worker@$$HOSTNAME --timeout 5",
        ]
      interval: 20s
      timeout: 15s
      start_period: 20s
      retries: 5
    depends_on: &worker-deps
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully

  # Transcription holds a Whisper model in memory, so it gets its own single-slot worker.
  worker-transcribe:
    image: clipforge-api
    <<: *api-env
    command:
      - celery
      - -A
      - app.workers.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=transcribe
      - --concurrency=1
      - --hostname=transcribe@%h
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.workers.celery_app:celery_app inspect ping -d transcribe@$$HOSTNAME --timeout 5",
        ]
      interval: 20s
      timeout: 15s
      start_period: 20s
      retries: 5
    volumes:
      - whispermodels:/models
    depends_on: *worker-deps

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  whispermodels:
  redisdata:
  miniodata:
